<header class="sticky top-0 z-20 bg-white/85 dark:bg-slate-900/85 backdrop-blur border-b border-gray-200 dark:border-slate-800">
    <div class="max-w-[1400px] mx-auto px-5 py-3 flex flex-wrap items-center gap-3">

        <a href="/" class="flex items-center gap-2 mr-3 hover:opacity-90 transition">
            <div class="w-9 h-9 rounded-lg bg-brand-600 flex items-center justify-center text-white text-lg shadow-sm">🛡️</div>
            <div class="leading-tight">
                <div class="text-sm font-semibold">Network Backup Manager</div>
                <div class="text-[11px] text-gray-500 dark:text-slate-400">
                    {{ header_subtitle or "Панель резервного копирования" }}
                </div>
            </div>
        </a>

        <div class="flex-1"></div>

        <div class="flex items-center gap-1.5">
            <a href="/"
               class="hidden md:inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium
                      bg-white dark:bg-slate-800 hover:bg-gray-100 dark:hover:bg-slate-700
                      border border-gray-200 dark:border-slate-700 transition">
                🏠 Главная
            </a>
            <a href="/scheduler"
               class="hidden md:inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium
                      bg-white dark:bg-slate-800 hover:bg-gray-100 dark:hover:bg-slate-700
                      border border-gray-200 dark:border-slate-700 transition">
                ⏰ Планировщик
            </a>
            <a href="/service"
               class="hidden md:inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium
                      bg-white dark:bg-slate-800 hover:bg-gray-100 dark:hover:bg-slate-700
                      border border-gray-200 dark:border-slate-700 transition">
                ⚙ Служба
            </a>
            <a href="/logs/main"
               class="hidden md:inline-flex items-center gap-1.5 px-3 py-2 rounded-lg text-xs font-medium
                      bg-white dark:bg-slate-800 hover:bg-gray-100 dark:hover:bg-slate-700
                      border border-gray-200 dark:border-slate-700 transition">
                📜 Логи
            </a>

            <button id="theme-toggle" title="Переключить тему"
                    class="w-9 h-9 inline-flex items-center justify-center rounded-lg
                           bg-white dark:bg-slate-800 hover:bg-gray-100 dark:hover:bg-slate-700
                           border border-gray-200 dark:border-slate-700 transition">
                <span class="dark:hidden">🌙</span>
                <span class="hidden dark:inline">☀️</span>
            </button>
        </div>
    </div>
</header>

<script>
    (function () {
        const btn = document.getElementById('theme-toggle');
        if (!btn) return;
        btn.addEventListener('click', () => {
            const el = document.documentElement;
            el.classList.toggle('dark');
            localStorage.setItem(
                'nbm-theme',
                el.classList.contains('dark') ? 'dark' : 'light'
            );
        });
    })();
</script>
