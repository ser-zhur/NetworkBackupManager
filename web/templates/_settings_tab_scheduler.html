{% if error %}
<div class="mb-4 px-4 py-3 rounded-lg text-sm
            bg-rose-50 dark:bg-rose-950/40
            border border-rose-200 dark:border-rose-900
            text-rose-800 dark:text-rose-300">
    ✗ Не сохранено: {{ error }}
</div>
{% endif %}

{% if message == 'saved' %}
<div class="mb-4 px-4 py-3 rounded-lg text-sm
            bg-emerald-50 dark:bg-emerald-950/40
            border border-emerald-200 dark:border-emerald-900
            text-emerald-800 dark:text-emerald-300">
    Настройки планировщика сохранены.
</div>
{% endif %}

<form action="/scheduler/save" method="POST" class="space-y-5">

    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm p-5
                flex items-center justify-between gap-4">
        <div>
            <label class="font-semibold text-gray-900 dark:text-slate-100 block">
                Автоматический бэкап всех устройств
            </label>
            <span class="text-xs text-gray-500 dark:text-slate-400">
                Запуск по расписанию в фоновом режиме
            </span>
        </div>
        <label class="relative inline-flex items-center cursor-pointer shrink-0">
            <input type="checkbox" name="enabled" value="true"
                   {% if config.enabled %}checked{% endif %}
                   class="sr-only peer">
            <div class="w-11 h-6 bg-gray-200 dark:bg-slate-700 rounded-full
                        peer-checked:bg-brand-600 transition
                        after:content-[''] after:absolute after:top-0.5 after:left-0.5
                        after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all
                        peer-checked:after:translate-x-5"></div>
        </label>
    </div>

    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-gray-200 dark:border-slate-800 shadow-sm p-6 space-y-4">
        <h3 class="text-sm font-semibold text-gray-700 dark:text-slate-200">Режим расписания</h3>

        <div class="space-y-3">
            <label class="flex items-start gap-3 p-4 rounded-xl cursor-pointer
                          bg-gray-50 dark:bg-slate-800/60
                          border border-gray-200 dark:border-slate-700
                          hover:border-brand-400 dark:hover:border-brand-600 transition">
                <input type="radio" name="mode" value="daily"
                       {% if config.mode == 'daily' %}checked{% endif %}
                       onchange="toggleSchedulerMode()"
                       class="mt-0.5 text-brand-600 focus:ring-brand-500">
                <div>
                    <span class="font-medium text-sm text-gray-900 dark:text-slate-100 block">
                        1. Ежедневно в фиксированное время
                    </span>
                    <span class="text-xs text-gray-500 dark:text-slate-400">
                        Бэкап выполняется один раз в сутки
                    </span>
                </div>
            </label>

            <label class="flex items-start gap-3 p-4 rounded-xl cursor-pointer
                          bg-gray-50 dark:bg-slate-800/60
                          border border-gray-200 dark:border-slate-700
                          hover:border-brand-400 dark:hover:border-brand-600 transition">
                <input type="radio" name="mode" value="interval"
                       {% if config.mode == 'interval' %}checked{% endif %}
                       onchange="toggleSchedulerMode()"
                       class="mt-0.5 text-brand-600 focus:ring-brand-500">
                <div>
                    <span class="font-medium text-sm text-gray-900 dark:text-slate-100 block">
                        2. Интервальный запуск
                    </span>
                    <span class="text-xs text-gray-500 dark:text-slate-400">
                        Запуск каждые N часов
                    </span>
                </div>
            </label>
        </div>

        <div id="daily-field" class="pt-2">
            <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1">
                Время запуска (ЧЧ:ММ):
            </label>
            <input type="time" name="daily_time"
                   value="{{ config.daily_time or '03:00' }}"
                   class="w-full max-w-xs rounded-lg px-3 py-2 text-sm font-mono
                          bg-gray-50 dark:bg-slate-950
                          border border-gray-200 dark:border-slate-800
                          focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
        </div>

        <div id="interval-field" class="pt-2 hidden">
            <label class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1">
                Интервал (в часах):
            </label>
            <input type="number" name="interval_hours" min="1" max="168"
                   value="{{ config.interval_hours or 24 }}"
                   class="w-full max-w-xs rounded-lg px-3 py-2 text-sm font-mono
                          bg-gray-50 dark:bg-slate-950
                          border border-gray-200 dark:border-slate-800
                          focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
        </div>
    </div>

    <div class="bg-brand-50 dark:bg-brand-950/40 border border-brand-200 dark:border-brand-900 rounded-xl p-4
                text-xs text-brand-800 dark:text-brand-200 font-mono flex items-center gap-2">
        <span>📌</span>
        <span>Последний автоматический запуск:</span>
        <b class="text-brand-900 dark:text-brand-100">{{ config.last_run or 'Ещё не производился' }}</b>
    </div>

    <div class="flex justify-end gap-3 pt-2">
        <button type="submit"
                class="px-6 py-2.5 rounded-lg text-sm font-medium
                       bg-brand-600 hover:bg-brand-700 text-white shadow-sm transition">
            Сохранить расписание
        </button>
    </div>
</form>

<script>
    function toggleSchedulerMode() {
        var isDaily = document.querySelector('input[name="mode"][value="daily"]').checked;
        document.getElementById('daily-field').classList.toggle('hidden', !isDaily);
        document.getElementById('interval-field').classList.toggle('hidden', isDaily);
    }
    toggleSchedulerMode();
</script>
