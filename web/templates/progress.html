<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выполнение бэкапа...</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-3xl w-full bg-black border border-gray-800 rounded-xl p-6 shadow-2xl">
        <div class="flex items-center justify-between mb-4">
            <h2 id="status-title" class="text-lg font-bold font-mono text-yellow-400">⏳ Выполнение резервного копирования...</h2>
            <div id="loader" class="animate-spin rounded-full h-5 w-5 border-b-2 border-yellow-400"></div>
        </div>
        <pre id="log-output" class="font-mono text-xs text-green-400 bg-gray-950 p-4 rounded-lg h-96 overflow-y-auto whitespace-pre-wrap border border-gray-900">Инициализация процесса...</pre>
        <div id="actions" class="mt-6 hidden text-right">
            <a href="/" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg text-sm font-medium transition shadow">Вернуться на главную</a>
        </div>
    </div>

    <script>
            const logOutput = document.getElementById('log-output');
            const statusTitle = document.getElementById('status-title');
            const loader = document.getElementById('loader');
            const actions = document.getElementById('actions');

            // Показываем результат, который уже был получен на сервере
            logOutput.textContent = JSON.stringify({{ result | tojson }}, null, 2);

            if ({{ 'true' if result.status == 'success' else 'false' }}) {
                statusTitle.textContent = "✅ Бэкап успешно завершен!";
                statusTitle.className = "text-lg font-bold font-mono text-green-400";
            } else {
                statusTitle.textContent = "❌ Ошибка выполнения бэкапа!";
                statusTitle.className = "text-lg font-bold font-mono text-red-400";
            }

            loader.style.display = "none";
            actions.classList.remove("hidden");
        
    </script>
</body>
</html>
