<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить устройство</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 py-10">
    <div class="container mx-auto px-4 max-w-2xl">
        <div class="bg-white rounded-xl shadow p-8">
            <h1 class="text-2xl font-bold mb-6 text-gray-900">➕ Добавить новое устройство</h1>
            
            <form action="/save-router" method="POST" class="space-y-6">
                
                <div class="p-5 bg-gray-50 rounded-xl border border-gray-200 space-y-4">
                    <h3 class="text-md font-semibold text-gray-700 flex items-center gap-2">
                        🔌 1. Параметры подключения к устройству
                    </h3>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Тип плагина:</label>
                        <select name="device_type" required class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                            {% for plugin in plugins %}
                                <option value="{{ plugin }}">{{ plugin }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">IP-адрес / Хост:</label>
                            <input type="text" name="ip" placeholder="192.168.88.1" required class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Версия (ROS / др.):</label>
                            <input type="text" name="version" value="7" required class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Пользователь SSH:</label>
                            <input type="text" name="username" value="admin" required class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Пароль SSH (зашифруется):</label>
                            <input type="password" name="ssh_pass" placeholder="••••••••" class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Путь к SSH-ключу (опционально):</label>
                        <input type="text" name="private_key" placeholder="id_rsa.key" class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none text-sm font-mono">
                    </div>
                </div>

                <div class="p-5 bg-gray-50 rounded-xl border border-gray-200 space-y-4">
                   <h3 class="text-md font-semibold text-gray-700 flex items-center gap-2">
                      📁 2. Локальное хранилище бэкапов
                   </h3>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Путь сохранения (директория):</label>
                        <input type="text" name="backup_path" value="backups/device_main" required class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Количество хранимых бэкапов:</label>
                        <input type="number" name="max_backups" value="5" min="1" required class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    </div>
                </div>

                <div class="p-5 bg-gray-50 rounded-xl border border-gray-200 space-y-4">
                    <h3 class="text-md font-semibold text-gray-700 flex items-center gap-2">
                        ☁️ 3. Внешний FTP-сервер (опционально)
                    </h3>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">FTP Хост:</label>
                            <input type="text" name="ftp_host" placeholder="192.168.88.254" class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">FTP Директория:</label>
                            <input type="text" name="ftp_dir" value="/network_backups" class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">FTP Пользователь:</label>
                            <input type="text" name="ftp_user" class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">FTP Пароль (зашифруется):</label>
                            <input type="password" name="ftp_pass" placeholder="••••••••" class="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <a href="/" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2 rounded-lg transition">Отмена</a>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-lg transition shadow">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
