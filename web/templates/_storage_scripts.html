<script>
// ============================================================
// УПРАВЛЕНИЕ required ДЛЯ ПОЛЕЙ STORAGE BACKEND
// ============================================================
//
// Поля, помеченные data-required="1", становятся обязательными
// только когда бэкенд включён. Это позволяет сохранять форму
// с выключенным FTP, не заполняя host/user.

function syncStorageRequired(backendId) {
    const section = document.querySelector(
        `[data-backend-id="${backendId}"]`
    );
    if (!section) return;

    const toggle = section.querySelector(
        `input[name="storage_${backendId}_enabled"]`
    );

    // Бэкенды с always_enabled (git) чекбокса не имеют —
    // их поля обязательны всегда, но у них required и нет.
    // Если чекбокс есть, required управляется им.
    const active = toggle ? toggle.checked : true;

    section.querySelectorAll('[data-required="1"]').forEach(el => {
        if (active) {
            el.setAttribute('required', 'required');
        } else {
            el.removeAttribute('required');
        }
    });
}

function initStorageRequired() {
    // Находим все секции бэкендов, у которых есть тумблер enabled
    document.querySelectorAll('[data-backend-id]').forEach(section => {
        const backendId = section.dataset.backendId;
        const toggle = section.querySelector(
            `input[name="storage_${backendId}_enabled"]`
        );
        if (!toggle) {
            // always_enabled: снимаем required со всех полей,
            // т.к. браузер не должен блокировать отправку
            // из-за необязательных для этой формы значений.
            // (Поля required у always_enabled сейчас отсутствуют,
            //  но оставляем защиту на будущее.)
            return;
        }

        toggle.addEventListener('change', () => {
            syncStorageRequired(backendId);
        });

        syncStorageRequired(backendId);
    });
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initStorageRequired);
} else {
    initStorageRequired();
}
async function testStorage(backendId, deviceType, index) {
    const resultEl = document.getElementById('storage-test-' + backendId);
    resultEl.textContent = 'Проверка…';
    resultEl.className = 'text-xs text-gray-500 dark:text-slate-400';

    const section = document.querySelector(`[data-backend-id="${backendId}"]`);
    const payload = {};

    section.querySelectorAll('input, select').forEach(el => {
        const m = el.name.match(/^storage_[^_]+_(.+)$/);
        if (!m) return;
        const key = m[1];

        if (el.type === 'checkbox') {
            payload[key] = el.checked;
        } else if (el.type === 'number') {
            payload[key] = el.value === '' ? '' : Number(el.value);
        } else {
            payload[key] = el.value;
        }
    });

    const url = `/api/storage/test/${backendId}`
              + `?device_type=${encodeURIComponent(deviceType)}`
              + `&index=${index}`;

    try {
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (data.ok) {
            resultEl.textContent = '✓ ' + data.message;
            resultEl.className = 'text-xs text-emerald-600 dark:text-emerald-400 font-medium';
        } else {
            resultEl.textContent = '✗ ' + data.message;
            resultEl.className = 'text-xs text-rose-600 dark:text-rose-400 font-medium';
        }
    } catch (e) {
        resultEl.textContent = 'Ошибка: ' + e.message;
        resultEl.className = 'text-xs text-rose-600 dark:text-rose-400 font-medium';
    }
}
</script>
<script>
(function () {
    'use strict';

    function findCommonAncestor(elements) {
        if (!elements.length) return null;
        var chain = [];
        var cur = elements[0].parentElement;
        while (cur) {
            chain.push(cur);
            cur = cur.parentElement;
        }
        for (var i = 0; i < chain.length; i++) {
            var c = chain[i];
            var ok = elements.every(function (el) {
                return c.contains(el);
            });
            if (ok) return c;
        }
        return null;
    }

    function initStorageToggles() {
        var checkboxes = document.querySelectorAll(
            'input[type="checkbox"][name^="storage_"][name$="_enabled"]'
        );

        checkboxes.forEach(function (cb) {
            var m = cb.name.match(/^storage_(.+)_enabled$/);
            if (!m) return;
            var backendId = m[1];

            var selector =
                '[name^="storage_' + backendId + '_"]';
            var all = Array.prototype.slice.call(
                document.querySelectorAll(selector)
            );
            var others = all.filter(function (el) {
                return el !== cb;
            });
            if (!others.length) return;

            var container = findCommonAncestor(
                [cb].concat(others)
            );
            if (!container) return;

            // Определяем «строки», которые надо прятать:
            // прямые (или почти прямые) потомки container,
            // содержащие поля backend'а, НО не содержащие
            // сам чекбокс. Это защищает строку с чекбоксом
            // и названием хранилища от скрытия.
            var rows = [];
            others.forEach(function (el) {
                var row = el;
                while (row && row.parentElement !== container) {
                    row = row.parentElement;
                }
                if (row && row !== container && !row.contains(cb)) {
                    rows.push(row);
                }
            });


            var enabledCbs = container.querySelectorAll(
                'input[type="checkbox"][name$="_enabled"]'
            );
            if (enabledCbs.length === 1) {
                Array.prototype.forEach.call(
                    container.children,
                    function (child) {
                        if (child.contains(cb)) return;
                        if (rows.indexOf(child) === -1) {
                            rows.push(child);
                        }
                    }
                );
            }


            rows = Array.from(new Set(rows));
            if (!rows.length) return;

            function update() {
                var on = cb.checked;
                rows.forEach(function (r) {
                    if (on) {
                        r.style.display = '';
                        r.animate(
                            [{ opacity: 0 }, { opacity: 1 }],
                            { duration: 150, easing: 'ease-out' }
                        );
                    } else {
                        r.style.display = 'none';
                    }
                });
            }

            cb.addEventListener('change', update);
            update();
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener(
            'DOMContentLoaded',
            initStorageToggles
        );
    } else {
        initStorageToggles();
    }
})();
</script>
