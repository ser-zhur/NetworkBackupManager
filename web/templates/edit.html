<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование устройства</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow p-6">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold">
                ⚙ Редактирование устройства
            </h1>

            <a href="/" class="text-blue-600 hover:underline">
                ← Назад
            </a>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Тип</label>
                <div class="mt-1 p-2 bg-gray-50 rounded border">{{ device_type }}</div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Имя</label>
                <div class="mt-1 p-2 bg-gray-50 rounded border">{{ router.name }}</div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Хост</label>
                <div class="mt-1 p-2 bg-gray-50 rounded border">{{ router.host }}</div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Путь бэкапов</label>
                <div class="mt-1 p-2 bg-gray-50 rounded border">{{ router.backup_path }}</div>
            </div>
        </div>

        <div class="mt-6 text-sm text-gray-500">
            Пока это страница просмотра. Сохранение настроек добавим на следующем этапе.
        </div>
    </div>
</body>
</html>
