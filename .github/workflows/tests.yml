# =========================================================
# Тесты на Windows и Linux при каждом push и pull request
# =========================================================
#
# rclone скачивается на временную машину GitHub — без него
# тесты внешних хранилищ и OAuth пропускаются. Версия
# закреплена (CI_RCLONE_VERSION), чтобы прогоны не менялись
# сами по себе с выходом новой rclone. Префикс RCLONE_ для
# своих переменных нельзя: rclone читает их как свои ключи.
#
# =========================================================

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CI_RCLONE_VERSION: v1.72.0

# Токен Actions по умолчанию — только чтение; запись
# разрешается отдельным заданиям.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.14"]
        include:
          # Самый старый поддерживаемый: системный Python Debian 12
          # (install.sh ставит программу на системный Python)
          - os: ubuntu-latest
            python: "3.11"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Install rclone
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) platform=windows-amd64 ;;
            *)       platform=linux-amd64 ;;
          esac
          name="rclone-${CI_RCLONE_VERSION}-${platform}"
          curl -fsSL -o "$RUNNER_TEMP/rclone.zip" \
            "https://downloads.rclone.org/${CI_RCLONE_VERSION}/${name}.zip"
          python -m zipfile -e "$RUNNER_TEMP/rclone.zip" "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/$name/rclone" 2>/dev/null || true
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          python main.py --version
          rclone version

      - name: Tests
        run: python -m pytest -q -rs
