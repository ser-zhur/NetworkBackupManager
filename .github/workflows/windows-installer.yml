# =========================================================
# Установщик Windows: сборка (build_exe.bat) и проверка
# =========================================================
#
# Собирает EXE (PyInstaller) и установщик (Inno Setup), затем
# на этой же машине: тихая установка → служба отвечает, все
# плагины загружены → обновление поверх (данные на месте, код
# прежней версии убран) → тихое удаление (данные остаются).
#
# Установщик — в артефактах прогона (Actions → прогон →
# Artifacts). По тегу v* этот workflow вызывает release.yml
# и прикладывает установщик к релизу.
#
# =========================================================

name: windows-installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: Версия программы (core/version.py)
        value: ${{ jobs.build.outputs.version }}

# Токен Actions по умолчанию — только чтение; запись
# разрешается отдельным заданиям.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - id: version
        name: Version
        shell: bash
        run: echo "version=$(python -c 'from core.version import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"

      - name: Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "Inno Setup не найден" }
          Write-Host "ISCC: $iscc"
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build EXE and installer
        shell: cmd
        run: build_exe.bat --no-pause

      - name: Build log on failure
        if: failure()
        shell: pwsh
        run: Get-Content build.log -Tail 120 -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: NetworkBackupManager-${{ steps.version.outputs.version }}-Setup
          path: dist/NetworkBackupManager-Setup.exe
          retention-days: 30
          if-no-files-found: error

      # -----------------------------------------------------
      # Проверка установщика на этой машине
      # -----------------------------------------------------
      - name: Silent install, service answers, plugins loaded
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = "$env:ProgramFiles\NetworkBackupManager"
          function Install-Nbm {
            $p = Start-Process dist\NetworkBackupManager-Setup.exe -Wait -PassThru `
                   -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=install.log'
            if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "установщик: код $($p.ExitCode)" }
          }
          function Wait-Healthy {
            for ($i = 0; $i -lt 90; $i++) {
              try {
                if ((Invoke-WebRequest http://127.0.0.1:8080/api/health -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { return }
              } catch {}
              Start-Sleep 1
            }
            Get-Content "$app\logs\*.log" -Tail 60 -ErrorAction SilentlyContinue
            throw "служба не ответила за 90 с"
          }
          function Get-Status($path, $user, $pass) {
            $h = @{}
            if ($user) {
              $b = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("${user}:${pass}"))
              $h = @{ Authorization = "Basic $b" }
            }
            try { (Invoke-WebRequest "http://127.0.0.1:8080$path" -Headers $h -UseBasicParsing -TimeoutSec 10).StatusCode }
            catch { $_.Exception.Response.StatusCode.value__ }
          }

          # Тихая установка: пользователь из окружения установщика
          $env:NBM_ADMIN_USER = "ci-admin"
          $env:NBM_ADMIN_PASSWORD = 'p@ss w0rd "ci"'
          Install-Nbm
          (Get-Service NetworkBackupManager).Status
          Wait-Healthy
          Write-Host "✅ установка, служба отвечает"

          if (-not (Test-Path "$app\data\auth.json")) { Get-Content install.log -Tail 40; throw "установщик не создал пользователя" }
          if ((Get-Content "$app\data\auth.json" -Raw) -match "w0rd") { throw "пароль в auth.json открытым текстом" }
          if ((Get-Status "/add" "ci-admin" 'p@ss w0rd "ci"') -ne 200) { throw "вход созданным пользователем не работает" }
          if ((Get-Status "/add" "ci-admin" "wrong") -ne 401) { throw "пустило с неверным паролем" }
          Write-Host "✅ пользователь веб-интерфейса создан установщиком"

          try { Invoke-WebRequest http://127.0.0.1:8080/add -UseBasicParsing | Out-Null; throw "без пароля пустило" }
          catch { if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw } }

          $log = Get-Content "$app\logs\app.log" -Raw -Encoding utf8
          foreach ($p in "mikrotik", "pfsense", "ssh") {
            if ($log -notmatch "Загружен плагин: $p") { throw "плагин $p не загружен" }
          }
          if ($log -match "не загружен") { throw "есть незагруженные плагины" }
          if (-not (Test-Path "$app\plugins\SSH\profiles\cisco_ios.json")) { throw "нет профилей SSH" }
          Write-Host "✅ вход закрыт паролем, все плагины и профили на месте"

          # --- Обновление поверх ---
          "keep me" | Set-Content "$app\data\marker.txt"
          "stale" | Set-Content "$app\_internal\stale-from-old-version.dll"
          $env:NBM_ADMIN_PASSWORD = "other-password"     # существующего не меняет
          Install-Nbm
          Wait-Healthy
          if ((Get-Status "/add" "ci-admin" 'p@ss w0rd "ci"') -ne 200) { throw "обновление сменило пароль пользователя" }
          Remove-Item Env:NBM_ADMIN_USER, Env:NBM_ADMIN_PASSWORD
          if (-not (Test-Path "$app\data\marker.txt")) { throw "обновление потеряло данные" }
          if (Test-Path "$app\_internal\stale-from-old-version.dll") { throw "остались файлы прежней версии" }
          Write-Host "✅ обновление: данные на месте, код прежней версии убран"

          # --- Удаление (тихое — данные остаются) ---
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\NetworkBackupManager.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\NetworkBackupManager.exe") { throw "программа не удалилась" }
          if (Get-Service NetworkBackupManager -ErrorAction SilentlyContinue) { throw "служба осталась" }
          if (-not (Test-Path "$app\data\marker.txt")) { throw "тихое удаление стёрло данные" }
          Write-Host "✅ удаление: служба и программа удалены, данные сохранены"
