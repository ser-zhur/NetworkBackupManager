[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
    -p no:cacheprovider
markers =
    slow: длительные тесты (генерация больших историй)
    integration: тесты, требующие установленного git CLI